<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>怀今的主页</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <script>
    (function () {
      var saved = null
      try { saved = localStorage.getItem('theme') } catch (e) {}
      var theme = (saved === 'light' || saved === 'dark')
        ? saved
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.setAttribute('data-theme', theme)
    })()
  </script>
  <script>
    (function () {
      var p = sessionStorage.getItem('ghpages-redirect')
      if (p && p !== '/' && p !== location.pathname) {
        sessionStorage.removeItem('ghpages-redirect')
        history.replaceState(null, '', p)
      }
    })()
  </script>
  <script type="module" crossorigin src="/assets/index-lMAdbLnP.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DYIb3Dlp.css">
</head>

</body>
